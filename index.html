<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside>
      <div class="nav-item">
        <svg class="logo">
          <use href="assets/sprite.svg#icon-dashboard"></use>
        </svg>
        <h2>Dashboard</h2>
      </div>
      <nav>
        <ul class="nav-main">
          <li>
            <a href="#">
              <span class="icon-container">
                <svg>
                  <use href="assets/sprite.svg#icon-home"></use>
                </svg>
              </span>
              <span class="icon-text"> Home </span>
            </a>
          </li>
          <li>
            <a href="#">
              <span class="icon-container">
                <svg>
                  <use href="assets/sprite.svg#icon-profile"></use>
                </svg>
              </span>
              <span class="icon-text"> Profile </span>
            </a>
          </li>
          <li>
            <a href="#">
              <span class="icon-container">
                <svg>
                  <use href="assets/sprite.svg#icon-message"></use>
                </svg>
              </span>
              <span class="icon-text"> Messages </span>
            </a>
          </li>
          <li>
            <a href="#">
              <span class="icon-container">
                <svg>
                  <use href="assets/sprite.svg#icon-history"></use>
                </svg>
              </span>
              <span class="icon-text"> History </span>
            </a>
          </li>
          <li>
            <a href="#">
              <span class="icon-container">
                <svg>
                  <use href="assets/sprite.svg#icon-tasks"></use>
                </svg>
              </span>
              <span class="icon-text"> Tasks </span>
            </a>
          </li>
          <li>
            <a href="#">
              <span class="icon-container">
                <svg>
                  <use href="assets/sprite.svg#icon-communities"></use>
                </svg>
              </span>
              <span class="icon-text"> Communities </span>
            </a>
          </li>
        </ul>
        <ul class="nav-second">
          <li>
            <a href="#">
              <span class="icon-container">
                <svg>
                  <use href="assets/sprite.svg#icon-settings"></use>
                </svg>
              </span>
              <span class="icon-text"> Settings </span>
            </a>
          </li>
          <li>
            <a href="#">
              <span class="icon-container">
                <svg>
                  <use href="assets/sprite.svg#icon-support"></use>
                </svg>
              </span>
              <span class="icon-text"> Support </span>
            </a>
          </li>
          <li>
            <a href="#">
              <span class="icon-container">
                <svg>
                  <use href="assets/sprite.svg#icon-privacy"></use>
                </svg>
              </span>
              <span class="icon-text"> Privacy </span>
            </a>
          </li>
        </ul>
      </nav>
    </aside>
    <header>
      <div class="header-top">
        <div class="search">
          <svg class="icon-top">
            <use href="assets/sprite.svg#icon-search"></use>
          </svg>
          <input type="search" />
        </div>
        <div class="user">
          <svg class="icon-top">
            <use href="assets/sprite.svg#icon-notification"></use>
          </svg>
          <img width="48" src="assets/images/jf.svg" class="profile" />
          <span>Jan Furrer</span>
        </div>
      </div>
      <div class="header-bottom">
        <div class="welcome">
          <img src="assets/images/jf.svg" class="profile" width="96px" />
          <div class="welcome-text">
            <div class="hi">Hi there,</div>
            <div class="name-social">Jan Furrer (@Jan)</div>
          </div>
        </div>
        <div class="buttons">
          <button>News</button>
          <button>Upload</button>
          <button>Share</button>
        </div>
      </div>
    </header>
    <main></main>
  </body>
</html>
